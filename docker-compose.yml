# =============================================================================
# Bolsa de Trabajo · stack completo
#   docker compose up -d --build          (dev: aplica también docker-compose.override.yml)
#   docker compose -f docker-compose.yml up -d --build   (sin override, tipo producción)
# Entrada única: http://localhost:${GATEWAY_PORT}  →  frontend + /api/v1/*
# =============================================================================

name: ${COMPOSE_PROJECT_NAME:-bolsa}

x-common: &common
  restart: unless-stopped
  networks: [backend]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

x-python-env: &python-env
  PYTHONUNBUFFERED: "1"
  ENVIRONMENT: ${ENVIRONMENT}
  LOG_LEVEL: ${LOG_LEVEL}
  TZ: ${TZ}
  SERVICE_TOKEN: ${SERVICE_TOKEN}
  JWKS_URL: http://auth-service:3000/api/v1/auth/.well-known/jwks.json
  JWT_ISSUER: ${JWT_ISSUER}
  JWT_AUDIENCE: ${JWT_AUDIENCE}
  N8N_WEBHOOK_BASE_URL: http://n8n:5678/webhook

x-depends-db: &depends-db
  postgres:
    condition: service_healthy

services:
  # ---------------------------------------------------------------- infra ----
  postgres:
    <<: *common
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # usados por infra/postgres/init/01-schemas.sh
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      PROFILE_DB_PASSWORD: ${PROFILE_DB_PASSWORD}
      JOBS_DB_PASSWORD: ${JOBS_DB_PASSWORD}
      MATCHING_DB_PASSWORD: ${MATCHING_DB_PASSWORD}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mail:
    <<: *common
    image: axllent/mailpit:v1.33.1
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "${MAIL_UI_PORT:-8025}:8025"

  # Antes de arrancar, n8n corre n8n/init/bootstrap.sh en el mismo contenedor: importa
  # las credenciales (NVIDIA desde .env, SMTP y Postgres) y los workflows de
  # n8n/workflows, y los publica. Corre en cada arranque, así una base nueva nunca queda
  # vacía. El repo es la fuente de verdad: los cambios hechos sólo en la UI se pisan.
  n8n:
    <<: *common
    image: n8nio/n8n:2.45.7   # los workflows son de n8n 2.x (en 1.x no se publican)
    depends_on: *depends-db
    entrypoint: ["tini", "--", "/bin/sh", "-c", "/bin/sh /n8n-init/bootstrap.sh && exec /docker-entrypoint.sh"]
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: n8n   # base propia (ver infra/postgres/init)
      DB_POSTGRESDB_USER: n8n_svc
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      GENERIC_TIMEZONE: ${TZ}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_SECURE_COOKIE: "false"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"   # los workflows leen URLs/tokens con $env
      # URLs que usan los workflows (nunca valores fijos en el JSON)
      AUTH_SERVICE_URL: http://auth-service:3000
      PROFILE_SERVICE_URL: http://profile-service:8000
      JOBS_SERVICE_URL: http://jobs-service:8000
      MATCHING_SERVICE_URL: http://matching-service:8000
      SERVICE_TOKEN: ${SERVICE_TOKEN}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_FROM: ${SMTP_FROM}
      # Opcionales (servidor SMTP real con usuario/TLS); Mailpit en dev no los necesita.
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      # WF-03 reenvía a WF-04 por un webhook interno del mismo n8n
      N8N_INTERNAL_WEBHOOK_URL: http://localhost:5678/webhook
      # Comunicación directa n8n -> mcp-tools por red interna (nunca pasa por Nginx)
      MCP_URL: http://mcp-tools:8000/mcp
      N8N_WEBHOOK_TOKEN: ${N8N_WEBHOOK_TOKEN}
      # Sólo los usa bootstrap.sh para crear la credencial "OpenAI account" (NVIDIA NIM).
      # La credencial apunta al proxy de mcp-tools, que reenvía a NVIDIA_BASE_URL y corta a
      # los AGENT_LLM_TIMEOUT_SECONDS (el timeout del nodo LLM de n8n no corta).
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://mcp-tools:8000/llm/v1}
    networks: [backend, mcp_internal]
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
      - ./n8n/init:/n8n-init:ro
    ports:
      - "${N8N_PORT:-5678}:5678"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5678/healthz"]
      interval: 15s
      timeout: 3s
      start_period: 120s   # incluye bootstrap.sh (~30 s) antes de que n8n escuche
      retries: 3

  # ------------------------------------------------------------- servicios ---
  auth-service:
    <<: *common
    build: { context: ./services/auth-service, target: runtime }
    depends_on: *depends-db
    environment:
      NODE_ENV: ${ENVIRONMENT}
      PORT: "3000"
      LOG_LEVEL: ${LOG_LEVEL}
      TZ: ${TZ}
      DATABASE_URL: postgresql://auth_svc:${AUTH_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=auth
      SERVICE_TOKEN: ${SERVICE_TOKEN}
      JWT_PRIVATE_KEY_PATH: ${JWT_PRIVATE_KEY_PATH}
      JWT_PUBLIC_KEY_PATH: ${JWT_PUBLIC_KEY_PATH}
      JWT_KEY_ID: ${JWT_KEY_ID:-bolsa-auth-1}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      PASSWORD_RESET_TTL: ${PASSWORD_RESET_TTL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_FROM: ${SMTP_FROM}
      FRONTEND_URL: ${FRONTEND_URL}
      N8N_WEBHOOK_BASE_URL: http://n8n:5678/webhook
      # Suscriptores de eventos de cuenta (borrado y edición). Ver contracts/auth.md, parte B
      ACCOUNT_EVENT_WEBHOOKS: ${ACCOUNT_EVENT_WEBHOOKS:-http://profile-service:8000/api/v1/profiles/internal/account-events,http://jobs-service:8000/api/v1/jobs/internal/account-events}
      ACCOUNT_EVENT_RETRY_INTERVAL_MS: ${ACCOUNT_EVENT_RETRY_INTERVAL_MS:-5000}
      ACCOUNT_EVENT_RETRY_BASE_MS: ${ACCOUNT_EVENT_RETRY_BASE_MS:-5000}
      ACCOUNT_EVENT_RETRY_MAX_MS: ${ACCOUNT_EVENT_RETRY_MAX_MS:-600000}
    volumes:
      - ./secrets:/run/secrets/jwt:ro

  profile-service:
    <<: *common
    build: ./services/profile-service
    depends_on: *depends-db
    environment:
      <<: *python-env
      DATABASE_URL: postgresql://profile_svc:${PROFILE_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PROFILE_DB_SCHEMA: profile
      # Pool de perfiles ficticios (mismos ids que los mocks de matching). false en producción.
      PROFILE_SEED_DEMO: ${PROFILE_SEED_DEMO:-true}
      # Para precargar email y datos legales de la empresa con GET /api/v1/auth/me
      AUTH_SERVICE_URL: http://auth-service:3000
      CV_STORAGE_PATH: ${CV_STORAGE_PATH}
      CV_MAX_SIZE_MB: ${CV_MAX_SIZE_MB}
    volumes:
      - cv_storage:/data/cvs

  jobs-service:
    <<: *common
    build: ./services/jobs-service
    depends_on: *depends-db
    environment:
      <<: *python-env
      DATABASE_URL: postgresql://jobs_svc:${JOBS_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JOBS_DB_SCHEMA: jobs
      # 12 ofertas ficticias (mismos ids que los mocks de matching). false en producción.
      JOBS_SEED_DEMO: ${JOBS_SEED_DEMO:-true}
      # company_snapshot de cada oferta nueva: GET /api/v1/auth/me con el Bearer de la empresa
      AUTH_SERVICE_URL: http://auth-service:3000
      # contacto del estudiante que se postula: GET /api/v1/profiles/me con su Bearer
      PROFILE_SERVICE_URL: http://profile-service:8000

  matching-service:
    <<: *common
    build: ./services/matching-service
    depends_on: *depends-db
    environment:
      <<: *python-env
      DATABASE_URL: postgresql://matching_svc:${MATCHING_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      MATCHING_DB_SCHEMA: matching
      PROFILE_SERVICE_URL: http://profile-service:8000
      JOBS_SERVICE_URL: http://jobs-service:8000
      # false = perfiles y ofertas reales de profile-service y jobs-service (por X-Service-Token).
      # true = pool ficticio de app/data/mock, sólo para probar matching aislado.
      MATCHING_USE_MOCKS: ${MATCHING_USE_MOCKS:-false}

  mcp-tools:
    <<: *common
    build: ./mcp-tools
    networks: [backend, mcp_internal]
    environment:
      PYTHONUNBUFFERED: "1"
      LOG_LEVEL: ${LOG_LEVEL}
      MCP_TRANSPORT: streamable-http
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8000"
      SERVICE_TOKEN: ${SERVICE_TOKEN}
      PROFILE_SERVICE_URL: http://profile-service:8000
      JOBS_SERVICE_URL: http://jobs-service:8000
      MATCHING_SERVICE_URL: http://matching-service:8000
      # Configuración de agentes (fuente única; luego vendrá del panel)
      AGENT_SETTINGS_SOURCE: ${AGENT_SETTINGS_SOURCE}
      NVIDIA_BASE_URL: ${NVIDIA_BASE_URL}
      AGENT_MODELS: ${AGENT_MODELS}
      AGENT_MODELS_CV: ${AGENT_MODELS_CV}
      AGENT_MODELS_VERIFIER: ${AGENT_MODELS_VERIFIER}
      NVIDIA_RPM_LIMIT: ${NVIDIA_RPM_LIMIT}
      AGENT_LLM_TIMEOUT_SECONDS: ${AGENT_LLM_TIMEOUT_SECONDS}
      AGENT_TEMPERATURE: ${AGENT_TEMPERATURE}
      AGENT_MAX_VERIFY_RETRIES: ${AGENT_MAX_VERIFY_RETRIES}
      RECO_MAX_JOBS_PER_STUDENT: ${RECO_MAX_JOBS_PER_STUDENT}
      RECO_MAX_PROFILES_PER_JOB: ${RECO_MAX_PROFILES_PER_JOB}
      RECO_MAX_ITEMS_PER_JOB: ${RECO_MAX_ITEMS_PER_JOB}
      RECO_MIN_SCORE: ${RECO_MIN_SCORE}
      # Notificaciones por mail de n8n (WF-02 a WF-05), leídas con get_agent_settings
      NOTIFY_ENABLED: ${NOTIFY_ENABLED:-true}
      NOTIFY_MIN_SCORE: ${NOTIFY_MIN_SCORE:-70}
      NOTIFY_MAX_PER_EVENT: ${NOTIFY_MAX_PER_EVENT:-10}
      NOTIFY_ADMIN_EMAIL: ${NOTIFY_ADMIN_EMAIL:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      CV_MAX_SIZE_MB: ${CV_MAX_SIZE_MB}
      CV_ALLOWED_EXTENSIONS: ${CV_ALLOWED_EXTENSIONS}
      CV_MAX_TEXT_CHARS: ${CV_MAX_TEXT_CHARS}
      # false = herramientas sobre profile/jobs/matching reales (mismo modo que
      # MATCHING_USE_MOCKS: si no coinciden, WF-06 pide rankings de IDs que el otro
      # lado no conoce). true = datos ficticios de app/infrastructure/gateways_mock.py.
      MCP_USE_MOCKS: ${MCP_USE_MOCKS:-false}

  # ------------------------------------------------------------- frontend ----
  frontend:
    <<: *common
    build: { context: ./frontend, target: runtime }
    networks: [edge]

  gateway:
    <<: *common
    image: nginxinc/nginx-unprivileged:1.27-alpine
    depends_on: [frontend]
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    networks: [edge, backend]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 3s
      retries: 3

networks:
  edge:          # gateway ↔ frontend
  backend:       # gateway ↔ APIs REST de negocio ↔ infra
  mcp_internal:  # canal directo y exclusivo n8n ↔ mcp-tools (sin pasar por gateway Nginx)

# Datos persistentes FUERA de los contenedores y de compose: volúmenes externos.
# Sobreviven a recrear contenedores/imágenes y también a `docker compose down -v`.
# Se crean una sola vez con infra/scripts/create-volumes.sh (o los comandos del README).
#   bolsa_pg_data    → Postgres: bases de todos los servicios, base de n8n y logos de empresas
#   bolsa_n8n_data   → configuración de n8n (/home/node/.n8n)
#   bolsa_cv_storage → CVs subidos por los estudiantes
volumes:
  pg_data:
    external: true
    name: ${COMPOSE_PROJECT_NAME:-bolsa}_pg_data
  n8n_data:
    external: true
    name: ${COMPOSE_PROJECT_NAME:-bolsa}_n8n_data
  cv_storage:
    external: true
    name: ${COMPOSE_PROJECT_NAME:-bolsa}_cv_storage
