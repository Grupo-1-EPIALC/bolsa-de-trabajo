[project]
name = "profile-service"
version = "0.5.0"


description = "Perfiles de estudiantes, carga de CV con IA y generación de CV en PDF/DOCX"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic-settings>=2.4,<3",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "pyjwt[crypto]>=2.8,<3",
    "jinja2>=3.1,<4",
    "weasyprint>=62,<70",
    "python-docx>=1.1,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "httpx>=0.27",
    "ruff>=0.6",
    "black>=24",
    "mypy>=1.11",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app" = ["templates/*.html", "infrastructure/data/*.json"]

[tool.ruff]
extend = "../../ruff.toml"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["weasyprint", "weasyprint.*", "docx", "docx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=app --cov-report=term-missing"

[tool.coverage.report]
# Gate de cobertura (AGENTS.md §2.3): >= 70 % en domain/ y application/
fail_under = 70
omit = ["app/main.py", "app/api/*", "app/infrastructure/*"]
