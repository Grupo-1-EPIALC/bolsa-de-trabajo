# Sirve el build estático de la SPA (imagen nginx-unprivileged, puerto 8080)
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
