# =============================================================================
# API Gateway · Nginx (imagen nginx-unprivileged, escucha en 8080)
# Las rutas se pasan completas (incluido /api/v1) al servicio destino.
# Se resuelve el DNS de Docker en cada request (resolver + variables) para que
# el gateway arranque aunque algún servicio todavía no esté levantado.
# =============================================================================

worker_processes auto;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;
    sendfile      on;
    keepalive_timeout 65;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                    'rt=$request_time upstream=$upstream_addr rid=$request_id';
    access_log /dev/stdout main;
    error_log  /dev/stderr warn;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # CV máx. 5 MB + margen multipart
    client_max_body_size 6m;

    # Rate limit para endpoints sensibles de auth (login, reset)
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Error JSON uniforme {"error": {...}} cuando un servicio no responde
    map $status $gateway_error_code {
        default "GATEWAY_ERROR";
        502     "SERVICE_UNAVAILABLE";
        503     "SERVICE_UNAVAILABLE";
        504     "SERVICE_TIMEOUT";
    }

    server {
        listen 8080;
        server_name _;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Request-ID $request_id always;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $request_id;
        # WebSocket (HMR de Vite en dev). Va acá y no en un location porque
        # cualquier proxy_set_header en un location anula TODOS los de server.
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        # Nunca aceptar el token interno desde afuera
        proxy_set_header X-Service-Token   "";
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;

        location = /health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok","service":"gateway"}';
        }

        # --- auth-service (NestJS) ---
        location ~ ^/api/v1/auth/(token|password/reset)$ {
            limit_req zone=auth_limit burst=5 nodelay;
            limit_req_status 429;
            set $up http://auth-service:3000;
            proxy_pass $up;
        }
        location /api/v1/auth/ {
            set $up http://auth-service:3000;
            proxy_pass $up;
        }

        # --- profile-service ---
        location /api/v1/profiles/ {
            set $up http://profile-service:8000;
            proxy_read_timeout 120s;
            proxy_pass $up;
        }

        # --- jobs-service (ofertas y búsquedas activas de empresa) ---
        location /api/v1/jobs/ {
            set $up http://jobs-service:8000;
            proxy_pass $up;
        }
        location /api/v1/companies/ {
            set $up http://jobs-service:8000;
            proxy_pass $up;
        }

        # --- matching-service ---
        location /api/v1/matches/ {
            set $up http://matching-service:8000;
            proxy_pass $up;
        }

        # NOTA DE ARQUITECTURA:
        # - No existe ai-service: toda la orquestación y ejecución de agentes IA corre en n8n.
        # - mcp-tools NO se publica ni pasa por Nginx: se comunica de forma directa y exclusiva
        #   con n8n por la red interna de contenedores (http://mcp-tools:8000/mcp).

        location /api/ {
            default_type application/json;
            return 404 '{"error":{"code":"NOT_FOUND","message":"Ruta no encontrada","details":null}}';
        }

        # --- frontend (SPA; en dev es Vite con HMR por websocket) ---
        location / {
            set $up http://frontend:8080;
            proxy_pass $up;
        }

        error_page 502 503 504 = @upstream_error;
        location @upstream_error {
            internal;
            default_type application/json;
            return 503 '{"error":{"code":"$gateway_error_code","message":"Servicio no disponible","details":null}}';
        }
    }
}
