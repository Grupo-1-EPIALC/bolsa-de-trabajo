name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Valida la convención obligatoria de ramas y flujo Git (AGENTS.md §3)
  branch-policy:
    name: Flujo Git y Versionado de Rama
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      HEAD_REF: ${{ github.head_ref }}
      BASE_REF: ${{ github.base_ref }}
    steps:
      - name: Validar nombre de rama según destino del PR
        run: |
          echo "Validando PR desde '$HEAD_REF' hacia '$BASE_REF'..."
          if [ "$BASE_REF" = "main" ]; then
            if [ "$HEAD_REF" != "dev" ]; then
              echo "::error::Hacia 'main' solo se permiten PRs de release desde la rama 'dev' (recibido: '$HEAD_REF')."
              exit 1
            fi
          elif [ "$BASE_REF" = "dev" ]; then
            PATTERN='^(feature|fix|refactor|test|docs|chore)/[a-z0-9-]+/v[0-9]+\.[0-9]+\.[0-9]+-[a-z0-9-]+$'
            if ! echo "$HEAD_REF" | grep -Eq "$PATTERN"; then
              echo "::error::La rama '$HEAD_REF' no cumple el formato '<tipo>/<servicio>/v<semver>-<descripcion>' (ej: feature/matching/v0.1.0-scoring-engine)."
              exit 1
            fi
          fi
          echo "Convención de rama válida."

  # Detecta qué carpetas cambiaron para correr sólo lo necesario
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      python: ${{ steps.py.outputs.services }}
      auth: ${{ steps.filter.outputs.auth }}
      frontend: ${{ steps.filter.outputs.frontend }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            profile-service: ['services/profile-service/**', 'ruff.toml']
            jobs-service: ['services/jobs-service/**', 'ruff.toml']
            matching-service: ['services/matching-service/**', 'ruff.toml']
            ai-service: ['services/ai-service/**', 'ruff.toml']
            mcp-tools: ['mcp-tools/**', 'ruff.toml']
            auth: ['services/auth-service/**']
            frontend: ['frontend/**']
            infra: ['docker-compose*.yml', 'gateway/**', 'infra/**', '.env.example', 'n8n/**']
      - name: Lista de servicios Python modificados
        id: py
        env:
          CHANGED: ${{ steps.filter.outputs.changes }}
        run: |
          echo "services=$(echo "$CHANGED" | jq -c '[.[] | select(. != "auth" and . != "frontend" and . != "infra")]')" >> "$GITHUB_OUTPUT"

  python:
    needs: changes
    if: ${{ needs.changes.outputs.python != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.python) }}
    defaults:
      run:
        working-directory: ${{ matrix.service == 'mcp-tools' && 'mcp-tools' || format('services/{0}', matrix.service) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: black --check .
      - run: mypy app
      - run: pytest

  auth-service:
    needs: changes
    if: ${{ needs.changes.outputs.auth == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/auth-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/auth-service/package-lock.json
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test

  frontend:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test

  compose:
    needs: changes
    if: ${{ needs.changes.outputs.infra == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose -f docker-compose.yml config --quiet

  # Check consolidado requerido por las reglas de protección de ramas (dev y main)
  ci-gate:
    name: CI Gate
    if: always()
    needs: [branch-policy, changes, python, auth-service, frontend, compose]
    runs-on: ubuntu-latest
    env:
      RESULTS: ${{ toJSON(needs.*.result) }}
    steps:
      - name: Verificar estado de jobs
        run: |
          echo "Resultados de jobs: $RESULTS"
          if echo "$RESULTS" | jq -e 'any(. == "failure" or . == "cancelled")' > /dev/null; then
            echo "::error::Al menos un job del CI falló o fue cancelado."
            exit 1
          fi
          echo "Todos los checks requeridos pasaron."
