[project]
name = "mcp-tools"
version = "0.10.0"
description = "Servidor MCP local con las herramientas para los agentes de IA"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mcp>=1.9,<2",
    "httpx>=0.27",
    "pydantic-settings>=2.4,<3",
    "jsonschema>=4.23",
    "pypdf>=5.0",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "httpx>=0.27",
    "respx>=0.21",
    "ruff>=0.6",
    "black>=24",
    "mypy>=1.11",
    "types-jsonschema>=4.23",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["data/*.json", "data/*.md", "data/schemas/*.json", "data/skills/**/*.md"]

[project.scripts]
mcp-tools = "app.main:main"

[tool.ruff]
extend = "../ruff.toml"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["docx", "docx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --cov=app --cov-report=term-missing"

[tool.coverage.report]
# Gate de cobertura (AGENTS.md §2.3): >= 70 % en domain/ y application/
fail_under = 70
omit = ["app/main.py"]
